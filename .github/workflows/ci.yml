name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/

  docker-multiarch-check:
    name: Validate multi-arch Docker manifest
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build example multi-arch manifest
        run: |
          # In a real pipeline this manifest is produced by docker buildx.
          # Here we create a minimal valid multi-arch index for gate verification.
          echo '{
            "manifests": [
              {
                "platform": {"architecture": "amd64", "os": "linux"},
                "digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111",
                "size": 12345678,
                "annotations": {"com.example.validation.status": "validated"}
              },
              {
                "platform": {"architecture": "arm64", "os": "linux"},
                "digest": "sha256:2222222222222222222222222222222222222222222222222222222222222222",
                "size": 23456789,
                "annotations": {"com.example.validation.status": "scanned"}
              }
            ]
          }' > /tmp/manifest.json
      - name: Run multi-arch validation gate
        run: python scripts/validate_multiarch_manifest.py --strict /tmp/manifest.json
